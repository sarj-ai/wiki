# Managed by code-standards; regenerate with `code-standards show ci --output .github/workflows/standards.yml`.
name: Standards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version-file: "backend/uv.toml"
          enable-cache: true
          cache-dependency-glob: |
            .sarj-standards.toml
            **/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Activate declared npm version
        run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: "frontend"
      - name: Install Python dependencies
        run: uv sync --locked --project backend
      - name: Bootstrap analysis inputs
        run: |
          npm --prefix frontend run generate:api
      - name: Bootstrap analysis inputs (2)
        run: |
          npm --prefix frontend run typegen
      - name: Run standards
        env:
          SARJ_STANDARDS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uvx --no-config --isolated --python 3.14 --from sarj-standards-bootstrap code-standards check --trust-repository-code --format github
