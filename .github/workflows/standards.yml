# Managed by code-standards; regenerate with `code-standards show ci --output .github/workflows/standards.yml`.
name: Standards

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "backend/uv.toml"
          enable-cache: true
          cache-dependency-glob: |
            .sarj-standards.toml
            **/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          check-latest: true
      - name: Activate declared npm version
        run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: "frontend"
      - name: Install Python dependencies
        run: uv sync --locked --project backend
      - name: Install the pinned native tool bootstrap
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: https://raw.githubusercontent.com/astral-sh/uv/f69fb50c8b28997af9c6b0e5c700a34470d86005/crates/uv-python-managed/download-metadata.json
        run: uv run --no-config --no-project --python 3.15.0 --with code-standards==8.43.2 python -m sarj_standards.libs.adoption.native_bootstrap
      - name: Install and attest applicable native tools
        run: uvx --no-config --isolated --python 3.14 --from sarj-standards-bootstrap code-standards setup --tools-only
      - name: Bootstrap analysis inputs
        run: |
          npm --prefix frontend run patches:apply
      - name: Bootstrap analysis inputs (2)
        run: |
          npm --prefix frontend run generate:api
      - name: Bootstrap analysis inputs (3)
        run: |
          npm --prefix frontend run typegen
      - name: Bootstrap analysis inputs (4)
        run: |
          mise --no-config --no-env --no-hooks exec aqua:hashicorp/terraform@1.15.8 -- terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - name: Run standards
        env:
          SARJ_STANDARDS_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: uvx --no-config --isolated --python 3.14 --from sarj-standards-bootstrap code-standards check --trust-repository-code --format github
