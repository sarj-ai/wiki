# Managed by sarj-standards 5.12.0; regenerate with `sarj-standards show ci --output .github/workflows/standards.yml`.
name: Standards

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.3'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Activate declared npm version
        run: npm install --global npm@11.18.0 --ignore-scripts
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: "frontend"
      - name: Install Python dependencies
        run: uv sync --locked --project backend
      - name: Bootstrap analysis inputs
        run: "npm --prefix frontend run generate:api"
      - name: Run standards
        run: uvx --isolated --python 3.14 --from sarj-standards==5.12.0 sarj-standards check --trust-repository-code --format github
