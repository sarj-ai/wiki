name: CI Quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (actionlint, hygiene, sarj rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uvx --python 3.14 pre-commit run --all-files --show-diff-on-failure

  api-contract:
    name: OpenAPI spec in sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: ${{ github.event_name == 'pull_request' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Export OpenAPI spec from the backend
        working-directory: backend
        run: uv run --frozen python scripts/export_openapi.py ../frontend/openapi.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- frontend/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify regenerated schemas typecheck and pass tests
        if: steps.drift.outputs.changed == 'true'
        working-directory: frontend
        run: |
          npm run typecheck
          npm test

      - name: Commit regenerated artifacts to the PR branch
        if: steps.drift.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/openapi.json
          git commit -m "chore: regenerate OpenAPI spec"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Fail on drift
        if: steps.drift.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: git diff --exit-code -- frontend/openapi.json

  secret-scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
