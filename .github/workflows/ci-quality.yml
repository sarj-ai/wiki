name: CI Quality

"on":
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (actionlint, hygiene, sarj rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install analysis dependencies
        run: |
          uv sync --locked --project backend
          npm ci --prefix frontend --no-audit --no-fund --ignore-scripts

      - name: Bootstrap analysis inputs
        run: npm --prefix frontend run generate:api

      - name: Verify canonical Standards configs
        run: make standards-check

      - name: Verify exact Python Standards baseline
        run: uv run --project backend --locked python scripts/check_standards.py --verify-python-baseline .

      - name: Suppression ratchet
        run: uv run --project backend --locked sarj-ratchet .

      - name: Reject lint baseline growth
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-baseline-growth.sh "$BASE_SHA"

      - name: Run pre-commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          uvx --python 3.14 pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure

  api-contract:
    name: OpenAPI spec in sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: ${{ github.event_name == 'pull_request' }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Export OpenAPI spec from the backend
        working-directory: backend
        run: uv run --locked python scripts/export_openapi.py ../frontend/openapi.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- frontend/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify regenerated schemas typecheck and pass tests
        if: steps.drift.outputs.changed == 'true'
        working-directory: frontend
        run: |
          npm run typecheck
          npm test

      - name: Commit regenerated artifacts to the PR branch
        if: steps.drift.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/openapi.json
          git commit -m "chore: regenerate OpenAPI spec"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Fail on drift
        if: steps.drift.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: git diff --exit-code -- frontend/openapi.json

  secret-scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
