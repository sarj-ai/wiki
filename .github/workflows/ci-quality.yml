name: CI Quality

"on":
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (actionlint, hygiene, sarj rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Verify canonical Standards configs
        run: make standards-check

      - name: Verify exact Python Standards baseline
        run: uv run --project backend --locked python scripts/check_standards.py --verify-python-baseline .

      - name: Suppression ratchet
        run: uv run --project backend --locked sarj-ratchet .

      - name: Reject lint baseline growth
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed_file="$RUNNER_TEMP/changed-files"
          git diff --name-only "$BASE_SHA"...HEAD > "$changed_file"
          # New-rule exemptions are decided by the checker, not here: it opens
          # them only when the `version` key inside .sarj-standards.toml (the
          # authoritative pin site) differs between base and HEAD — a genuine
          # toolchain upgrade whose newly adopted rules are absorbed by
          # regeneration, then ratcheted. A comment or dest edit to that file
          # earns nothing. The base strict ESLint config further scopes the
          # exemption: rules it already enforced can never absorb new findings.
          git show "$BASE_SHA:.sarj-standards.toml" > "$RUNNER_TEMP/base-standards.toml"
          {
            git show "$BASE_SHA:frontend/eslint.strict.mjs"
            git show "$BASE_SHA:frontend/eslint.config.mjs"
          } > "$RUNNER_TEMP/base-eslint-configs.mjs"
          for baseline in python-standards-baseline.json frontend/eslint-suppressions.json; do
            base_file="$RUNNER_TEMP/$(basename "$baseline")"
            scope_args=()
            if [[ "$baseline" == frontend/* ]]; then
              scope_args=(--base-config "$RUNNER_TEMP/base-eslint-configs.mjs")
            fi
            if git show "$BASE_SHA:$baseline" > "$base_file" 2>/dev/null; then
              uv run --project backend --locked python scripts/check_baseline_growth.py \
                --standards-base "$RUNNER_TEMP/base-standards.toml" \
                --standards-current .sarj-standards.toml \
                "${scope_args[@]}" \
                "$base_file" "$baseline"
            else
              prefix=""
              if [[ "$baseline" == frontend/* ]]; then prefix="frontend/"; fi
              uv run --project backend --locked python scripts/check_baseline_growth.py \
                --initial "$baseline" "$changed_file" "$prefix"
            fi
          done

      - name: Run pre-commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          uvx --python 3.14 pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure

  api-contract:
    name: OpenAPI spec in sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: ${{ github.event_name == 'pull_request' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Export OpenAPI spec from the backend
        working-directory: backend
        run: uv run --locked python scripts/export_openapi.py ../frontend/openapi.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- frontend/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify regenerated schemas typecheck and pass tests
        if: steps.drift.outputs.changed == 'true'
        working-directory: frontend
        run: |
          npm run typecheck
          npm test

      - name: Commit regenerated artifacts to the PR branch
        if: steps.drift.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/openapi.json
          git commit -m "chore: regenerate OpenAPI spec"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Fail on drift
        if: steps.drift.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: git diff --exit-code -- frontend/openapi.json

  secret-scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
