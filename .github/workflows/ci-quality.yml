name: CI Quality

"on":
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (actionlint, hygiene, sarj rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/uv.toml

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install analysis dependencies
        run: |
          uv sync --locked --project backend
          npm ci --prefix frontend --no-audit --no-fund --ignore-scripts

      - name: Bootstrap analysis inputs
        run: npm --prefix frontend run generate:api

      - name: Verify executable repository documentation
        run: make check-repository

      - name: Verify canonical Standards configs
        run: make standards-check

      - name: Verify exact Python Standards baseline
        run: uv run --project backend --locked python scripts/check_standards.py --verify-python-baseline .

      - name: Suppression ratchet
        run: uv run --project backend --locked sarj-ratchet .

      - name: Reject lint baseline growth
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-baseline-growth.sh "$BASE_SHA"

      - name: Run pre-commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" ]]; then
            uvx --python 3.14 pre-commit run --all-files --show-diff-on-failure
            exit 0
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          uvx --python 3.14 pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure

  api-contract:
    name: OpenAPI spec in sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/uv.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify committed OpenAPI spec
        working-directory: backend
        run: uv run --locked python scripts/export_openapi.py --check ../frontend/openapi.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

  secret-scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
