# Temporary native runner comparison. Remove this workflow before merging.
name: Native runner comparison
'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
concurrency:
  group: runner-comparison-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline_ci_frontend_lint_and_typecheck:
    name: Runner benchmark / baseline / ci-frontend / Frontend / Lint + typecheck + format
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint with exact baseline
        run: npm run lint:baseline-check
      - name: Knip
        run: npm run knip
      - name: Type coverage
        run: npm run type-coverage
      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
  baseline_ci_frontend_test:
    name: Runner benchmark / baseline / ci-frontend / Frontend / Unit tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm test
    timeout-minutes: 20
    if: '!cancelled()'
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
  baseline_ci_frontend_build:
    name: Runner benchmark / baseline / ci-frontend / Frontend / Next.js build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore Next.js incremental build cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: frontend/.next/cache
          key: nextjs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha
            }}
          restore-keys: |
            nextjs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
      - name: Build Cloudflare Worker
        run: npm run build:worker -- --skipNextBuild
      - name: Smoke test packaged Worker runtime
        run: bash scripts/smoke-worker.sh
      - name: Save trusted main Next.js incremental build cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit
          != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: frontend/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
    timeout-minutes: 20
    if: '!cancelled()'
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
  arm_ci_frontend_lint_and_typecheck:
    name: Runner benchmark / arm / ci-frontend / Frontend / Lint + typecheck + format
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint with exact baseline
        run: npm run lint:baseline-check
      - name: Knip
        run: npm run knip
      - name: Type coverage
        run: npm run type-coverage
      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
  arm_ci_frontend_test:
    name: Runner benchmark / arm / ci-frontend / Frontend / Unit tests
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm test
    timeout-minutes: 20
    if: '!cancelled()'
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
  arm_ci_frontend_build:
    name: Runner benchmark / arm / ci-frontend / Frontend / Next.js build
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore Next.js incremental build cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: frontend/.next/cache
          key: nextjs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha
            }}
