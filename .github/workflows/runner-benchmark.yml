    if: '!cancelled()'
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
  baseline_ci_quality_repository_quality:
    name: Runner benchmark / baseline / ci-quality / pre-commit (actionlint, hygiene, sarj rules)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version-file: backend/uv.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-v4.6.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/.python-version', '.pre-commit-config.yaml')
            }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install analysis dependencies
        run: uv sync --locked --project backend
      - name: Install frontend analysis dependencies
        run: npm ci --prefix frontend --no-audit --no-fund --ignore-scripts
      - name: Bootstrap analysis inputs
        run: npm --prefix frontend run generate:api
      - name: Verify executable repository documentation
        run: make check-repository
      - name: Suppression ratchet
        run: uv run --project backend --locked sarj-ratchet .
      - name: Verify exact Python Standards baseline
        run: uv run --project backend --locked python scripts/check_standards.py --verify-python-baseline .
      - name: Reject lint baseline growth
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-baseline-growth.sh "$BASE_SHA"
      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
