        run: make check-iac
      - name: Trivy config scan (gate HIGH+CRITICAL)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          output: trivy-report.txt
