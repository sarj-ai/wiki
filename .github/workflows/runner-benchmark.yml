      - name: Smoke test packaged Worker runtime
        run: bash scripts/smoke-worker.sh
      - name: Save trusted main Next.js incremental build cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit
          != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: frontend/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
    timeout-minutes: 20
    if: '!cancelled()'
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
  baseline_ci_backend_lint_and_typecheck:
    name: Runner benchmark / baseline / ci-backend / Backend / Lint + typecheck
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version-file: backend/uv.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Ruff check
        run: uv run ruff check --output-format=github .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Identify Mypy cache toolchain
        id: mypy-toolchain
        run: |
          uv run python -c 'import importlib.metadata, platform; print("python=" + platform.python_version()); print("mypy=" + importlib.metadata.version("mypy"))' >>"$GITHUB_OUTPUT"
      - name: Restore Mypy incremental data
        id: mypy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: backend/.mypy_cache
          key: mypy-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.mypy-toolchain.outputs.python }}-mypy${{ steps.mypy-toolchain.outputs.mypy
            }}-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'backend/.python-version', 'backend/uv.toml', 'backend/mypy.ini',
            'backend/.mypy.ini', 'backend/setup.cfg', '.sarj-standards.toml', '.github/workflows/ci-backend.yml') }}-${{ github.sha
            }}
          restore-keys: |
            mypy-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.mypy-toolchain.outputs.python }}-mypy${{ steps.mypy-toolchain.outputs.mypy }}-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'backend/.python-version', 'backend/uv.toml', 'backend/mypy.ini', 'backend/.mypy.ini', 'backend/setup.cfg', '.sarj-standards.toml', '.github/workflows/ci-backend.yml') }}-
            mypy-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.mypy-toolchain.outputs.python }}-mypy${{ steps.mypy-toolchain.outputs.mypy }}-
      - name: Mypy strict
        run: uv run mypy app
      - name: Basedpyright strict
        run: uv run basedpyright -p pyrightconfig.json
      - name: ty check (app)
        run: uv run ty check app
      - name: Vulture dead-code check
        run: uv run vulture
      - name: Import contracts
        run: uv run lint-imports
      - name: pip-audit
        run: uv run pip-audit
      - name: Save trusted main Mypy incremental data
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mypy-cache.outputs.cache-hit
          != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: backend/.mypy_cache
          key: ${{ steps.mypy-cache.outputs.cache-primary-key }}
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
  baseline_ci_backend_test:
    name: Runner benchmark / baseline / ci-backend / Backend / Unit tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version-file: backend/uv.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Run pytest
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=70
    timeout-minutes: 20
    if: '!cancelled()'
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
  baseline_ci_backend_postgres_concurrency:
    name: Runner benchmark / baseline / ci-backend / Backend / PostgreSQL concurrency
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: wiki_polish29_qa
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd "pg_isready -U postgres -d wiki_polish29_qa" --health-interval 5s --health-timeout 5s --health-retries
          10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/wiki_polish29_qa
      WIKI_POLISH29_QA_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/wiki_polish29_qa
      WIKI_MCP_QA_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/wiki_polish29_qa
      SECRET_KEY: disposable-postgres-concurrency-qa-only
      FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GOOGLE_CLIENT_ID: disposable-qa-client
      GOOGLE_CLIENT_SECRET: disposable-qa-client-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version-file: backend/uv.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Apply actual schema migrations to the disposable database
        run: uv run --locked alembic upgrade head
      - name: Exercise concurrent source reservations and durable replay keys
        run: uv run --locked pytest tests/test_task_source_dedupe_postgres.py tests/test_header_provenance_postgres.py tests/test_route_performance_postgres.py
          tests/test_provider_performance_postgres.py tests/test_storage_performance_postgres.py tests/test_storage_hot_paths_postgres.py
          tests/test_document_transform_qa_grants.py tests/test_document_transform_qa_submit_postgres.py tests/test_document_transform_qa_corpus_postgres.py
          -q -rA tests/test_document_transform_qa_campaigns_postgres.py -q -rA
      - name: Exercise MCP storage and client grants across database sessions
        run: uv run --locked pytest tests/test_mcp_storage.py tests/test_mcp_grants.py tests/test_native_mcp_core.py tests/test_mcp_native_runtime.py
          tests/test_mcp_native_admission.py -q -rA
    if: '!cancelled()'
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
  arm_ci_backend_lint_and_typecheck:
    name: Runner benchmark / arm / ci-backend / Backend / Lint + typecheck
