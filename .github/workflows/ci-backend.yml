name: CI Backend

"on":
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-typecheck:
    name: Backend / Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/uv.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy app

      - name: Basedpyright strict
        run: uv run basedpyright -p pyrightconfig.json

      - name: ty check (app)
        run: uv run ty check app

      - name: Vulture dead-code check
        run: uv run vulture

      - name: Import contracts
        run: uv run lint-imports

      - name: pip-audit
        run: uv run pip-audit

      - name: Standards Ruff strict
        run: uv run ruff check --output-format=github .

      - name: Standards Basedpyright strict
        run: uv run basedpyright -p pyrightconfig.json

  test:
    name: Backend / Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/uv.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Run pytest
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  image:
    name: Backend / Image build + Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: false
          load: true
          tags: backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: backend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  required:
    name: Backend / required
    if: ${{ always() }}
    needs: [lint-and-typecheck, test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every backend gate
        working-directory: .
        env:
          IMAGE_RESULT: ${{ needs.image.result }}
          LINT_RESULT: ${{ needs.lint-and-typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
          test "$IMAGE_RESULT" = success
