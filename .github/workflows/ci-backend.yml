name: CI Backend

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy app

      # Report-only: surfaces the org-wide maximally-strict ruleset from
      # sarj-ai/standards as GitHub annotations without gating the build.
      # Promote to blocking once the findings are triaged (see follow-ups).
      - name: org-strict ruff (report-only)
        continue-on-error: true
        run: uv run ruff check --config .ruff-strict.toml --output-format=github .

      # Report-only: custom AST rules from sarj-ai/standards via pre-commit.
      - name: sarj custom lint rules (report-only)
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run pytest
        run: uv run pytest --cov=app --cov-report=term-missing
