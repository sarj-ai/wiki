name: CI Backend

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy app

      - name: Import contracts
        run: uv run lint-imports

      - name: pip-audit (report-only)
        continue-on-error: true
        run: uv run pip-audit

      - name: org-strict ruff (report-only)
        continue-on-error: true
        run: uv run ruff check --config .ruff-strict.toml --output-format=github .

      - name: org-strict pyright (report-only)
        continue-on-error: true
        run: uv run pyright -p .pyright-strict.toml app

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # --cov-fail-under is a no-regression ratchet: raise it, never lower it.
      - name: Run pytest
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=38
