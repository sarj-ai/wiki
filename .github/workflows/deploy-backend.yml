name: Deploy Backend

"on":
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  PROJECT_ID: sarj-docs
  REGION: me-central1
  REPOSITORY: sarj-docs
  SERVICE: sarj-docs-backend
  IMAGE: backend
  SMART_CREATE_QUEUE_NAME: smart-create

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        working-directory: backend
        run: uv python install

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev --locked

      - name: Run pre-commit custom standards
        run: uvx --python 3.14 pre-commit run --all-files --show-diff-on-failure

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Mypy strict
        working-directory: backend
        run: uv run mypy app

      - name: Basedpyright strict
        working-directory: backend
        run: uv run basedpyright -p pyrightconfig.json

      - name: ty check
        working-directory: backend
        run: uv run ty check app

      - name: Vulture dead-code check
        working-directory: backend
        run: uv run vulture

      - name: Import contracts
        working-directory: backend
        run: uv run lint-imports

      - name: pip-audit
        working-directory: backend
        run: uv run pip-audit

      - name: Unit tests
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Verify Smart Create queue exists
        run: |
          gcloud tasks queues describe "${{ env.SMART_CREATE_QUEUE_NAME }}" \
            --location "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format="value(name)"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Artifact Registry has immutable_tags enabled (terraform/registry.tf).
          # buildx provenance/SBOM attestations push the image under the tag and
          # then *update* the tag to a manifest index — which immutable tags
          # reject ("cannot update tag"), failing every deploy. Push a single
          # image manifest instead so the tag is only ever created, not updated.
          provenance: false
          sbom: false

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
