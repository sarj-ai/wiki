name: Deploy Backend

"on":
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  PROJECT_ID: sarj-docs
  REGION: me-central1
  REPOSITORY: sarj-docs
  SERVICE: sarj-docs-backend
  IMAGE: backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        working-directory: backend
        run: uv python install

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev --frozen

      - name: Run pre-commit custom standards
        run: uvx --python 3.14 pre-commit run --all-files --show-diff-on-failure

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Mypy strict
        working-directory: backend
        run: uv run mypy app

      - name: Basedpyright strict
        working-directory: backend
        run: uv run basedpyright -p pyrightconfig.json

      - name: ty check
        working-directory: backend
        run: uv run ty check app

      - name: Vulture dead-code check
        working-directory: backend
        run: uv run vulture

      - name: Import contracts
        working-directory: backend
        run: uv run lint-imports

      - name: pip-audit
        working-directory: backend
        run: uv run pip-audit

      - name: Unit tests
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Artifact Registry has immutable_tags enabled (terraform/registry.tf).
          # buildx provenance/SBOM attestations push the image under the tag and
          # then *update* the tag to a manifest index — which immutable tags
          # reject ("cannot update tag"), failing every deploy. Push a single
          # image manifest instead so the tag is only ever created, not updated.
          provenance: false
          sbom: false

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Debian bookworm ships HIGH/CRITICAL CVEs with no patched package
          # (will_not_fix / fix_deferred: zlib1g, perl-base, libsqlite3-0, ...).
          # `apt-get upgrade` in the Dockerfile cannot clear them, so gating on
          # them blocks every deploy on findings nobody can action. Gate on
          # fixable CVEs only — those are the ones a rebuild actually resolves.
          ignore-unfixed: true

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
