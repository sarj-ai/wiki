name: Deploy Backend

"on":
  workflow_call:
    inputs:
      release_needs:
        description: Exact qualification results from the trusted main release DAG
        type: string
        required: true
    secrets:
      WIF_PROVIDER:
        required: true
      WIF_SERVICE_ACCOUNT:
        required: true
  workflow_dispatch:
    inputs:
      verification_run_id:
        description: "Verification only: completed run ID with successful migration and traffic switch (pair with its run attempt; leave both empty to deploy)"
        type: string
        required: false
        default: ""
      verification_run_attempt:
        description: "Verification only: exact run attempt for verification_run_id (pair with its run ID; leave both empty to deploy)"
        type: string
        required: false
        default: ""

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  PROJECT_ID: sarj-docs
  REGION: ${{ vars.BACKEND_REGION || 'me-central2' }}
  REPOSITORY: ${{ vars.BACKEND_REPOSITORY || 'sarj-docs-dammam' }}
  SERVICE: ${{ vars.BACKEND_SERVICE || 'sarj-docs-backend-dammam' }}
  MIGRATION_JOB: ${{ vars.BACKEND_MIGRATION_JOB || 'sarj-docs-backend-migrations-dammam' }}
  IMAGE: backend
  SMART_CREATE_QUEUE_NAME: ${{ vars.SMART_CREATE_QUEUE_NAME || 'smart-create-dammam' }}
  DOCUMENT_TRANSFORM_QUEUE_NAME: ${{ vars.DOCUMENT_TRANSFORM_QUEUE_NAME || 'document-transform-dammam' }}

defaults:
  run:
    shell: bash

jobs:
  ci-backend:
    if: inputs.release_needs == '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_run_id == '' && inputs.verification_run_attempt == ''))
    permissions:
      contents: read
    uses: ./.github/workflows/ci-backend.yml

  ci-frontend:
    if: inputs.release_needs == '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_run_id == '' && inputs.verification_run_attempt == ''))
    permissions:
      contents: read
    uses: ./.github/workflows/ci-frontend.yml

  ci-quality:
    if: inputs.release_needs == '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_run_id == '' && inputs.verification_run_attempt == ''))
    permissions:
      contents: read
    uses: ./.github/workflows/ci-quality.yml

  ci-iac:
    if: inputs.release_needs == '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_run_id == '' && inputs.verification_run_attempt == ''))
    permissions:
      contents: read
    uses: ./.github/workflows/ci-iac.yml

  standards-receipt:
    if: inputs.release_needs == '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_run_id == '' && inputs.verification_run_attempt == ''))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      release_sha: ${{ steps.receipt.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: backend/uv.toml
          enable-cache: false

      - name: Verify exact main Standards receipt
        id: receipt
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/github/verify-release-gate.sh standards backend

  deploy:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_run_id == '' && inputs.verification_run_attempt == '')) && (inputs.release_needs != '' || (needs.ci-backend.result == 'success' && needs.ci-frontend.result == 'success' && needs.ci-quality.result == 'success' && needs.ci-iac.result == 'success' && needs.standards-receipt.result == 'success')) }}
    needs: [ci-backend, ci-frontend, ci-quality, ci-iac, standards-receipt]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: backend/uv.toml

      - name: Confirm main has not advanced before cloud authentication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NEEDS: ${{ inputs.release_needs || toJSON(needs) }}
        run: bash scripts/github/verify-release-gate.sh ready backend

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Verify task queues are running
        run: scripts/github/verify-smart-create-queue.sh

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: RELEASE_SHA=${{ github.sha }}
          context: backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Artifact Registry has immutable_tags enabled (terraform/registry.tf).
          # buildx provenance/SBOM attestations push the image under the tag and
          # then *update* the tag to a manifest index — which immutable tags
          # reject ("cannot update tag"), failing every deploy. Push a single
          # image manifest instead so the tag is only ever created, not updated.
          provenance: false
          sbom: false

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Deploy candidate without traffic
        id: deploy
        run: scripts/github/deploy-backend-candidate.sh

      - name: Run database migrations once
        id: migrate
        env:
          RELEASE_IMAGE: ${{ steps.deploy.outputs.release_image }}
        run: scripts/github/run-backend-migrations.sh

      - name: Switch production traffic
        id: traffic
        env:
          CANDIDATE_REVISION: ${{ steps.deploy.outputs.new_revision }}
        run: scripts/github/switch-backend-production-traffic.sh

      - name: Verify revision and production health
        id: verify
        run: scripts/github/verify-backend-production-health.sh

      - name: Resolve native MCP mode from exact revision
        id: mcp-mode
        env:
          MCP_VERIFIED_REVISION: ${{ steps.verify.outputs.new_revision }}
        run: scripts/github/resolve-mcp-release-mode.sh

      - name: Verify native MCP production contract
        env:
          MCP_VERIFY_MODE: ${{ steps.mcp-mode.outputs.mode }}
          MCP_VERIFIED_REVISION: ${{ steps.verify.outputs.new_revision }}
          MCP_LOG_WINDOW_START: ${{ steps.deploy.outputs.started_at }}
        run: scripts/github/verify-mcp-release.sh

      - name: Verify correlated production logs
        env:
          CANARY_ID: ${{ steps.verify.outputs.canary_id }}
          DEPLOY_STARTED_AT: ${{ steps.deploy.outputs.started_at }}
          VERIFIED_REVISION: ${{ steps.verify.outputs.new_revision }}
          VERIFY_FINISHED_AT: ${{ steps.verify.outputs.finished_at }}
        run: scripts/github/verify-backend-correlated-logs.sh

      - name: Report blocked release without rollback
        if: failure()
        env:
          CANDIDATE_REVISION: ${{ steps.deploy.outputs.new_revision || 'unknown' }}
          MIGRATION_OUTCOME: ${{ steps.migrate.outcome || 'not-run' }}
          PREVIOUS_REVISION: ${{ steps.deploy.outputs.previous_revision || 'unknown' }}
          TRAFFIC_OUTCOME: ${{ steps.traffic.outcome || 'not-run' }}
        run: scripts/github/report-blocked-backend-release.sh

  verify-existing:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.verification_run_id != '' && inputs.verification_run_attempt != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: backend/uv.toml
          enable-cache: false
      - name: Verify completed source mutation receipts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.verification_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.verification_run_id }}
        run: uv run --no-project --with typer==0.27.3 --python 3.14 python -m scripts.backend_release.recovery --verifier-sha "$GITHUB_SHA" source --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT" --github-output >>"$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Verify exact serving image before canary
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE_SHA: ${{ steps.source.outputs.source_sha }}
        run: bash scripts/backend_release/verify-serving.sh
      - name: Verify task queues are running
        run: scripts/github/verify-smart-create-queue.sh
      - name: Begin fresh verification window
        id: window
        run: date -u +'started_at=%Y-%m-%dT%H:%M:%S.%NZ' >>"$GITHUB_OUTPUT"
      - name: Verify revision and production health
        id: verify
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.source.outputs.source_sha }}
        run: scripts/github/verify-backend-production-health.sh
      - name: Resolve native MCP mode from exact revision
        id: mcp-mode
        env:
          MCP_VERIFIED_REVISION: ${{ steps.verify.outputs.new_revision }}
        run: scripts/github/resolve-mcp-release-mode.sh

      - name: Verify native MCP production contract
        env:
          MCP_VERIFY_MODE: ${{ steps.mcp-mode.outputs.mode }}
          MCP_VERIFIED_REVISION: ${{ steps.verify.outputs.new_revision }}
          MCP_LOG_WINDOW_START: ${{ steps.window.outputs.started_at }}
        run: scripts/github/verify-mcp-release.sh
      - name: Verify correlated production logs
        env:
          CANARY_ID: ${{ steps.verify.outputs.canary_id }}
          DEPLOY_STARTED_AT: ${{ steps.window.outputs.started_at }}
          EXPECTED_RELEASE_SHA: ${{ steps.source.outputs.source_sha }}
          VERIFIED_REVISION: ${{ steps.verify.outputs.new_revision }}
          VERIFY_FINISHED_AT: ${{ steps.verify.outputs.finished_at }}
        run: scripts/github/verify-backend-correlated-logs.sh
      - name: Recheck exact serving image after verification
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE_SHA: ${{ steps.source.outputs.source_sha }}
        run: bash scripts/backend_release/verify-serving.sh

  reject-partial-verification-inputs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && ((inputs.verification_run_id == '' && inputs.verification_run_attempt != '') || (inputs.verification_run_id != '' && inputs.verification_run_attempt == ''))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require a complete verification source identity
        run: exit 1
