name: Deploy Backend

"on":
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - "scripts/github/release_gate.py"
      - "scripts/github/verify-release-gate.sh"
      - "scripts/github/clear-legacy-drive-tree-cache.sh"
      - "scripts/github/deploy-backend-candidate.sh"
      - "scripts/github/report-blocked-backend-release.sh"
      - "scripts/github/run-backend-migrations.sh"
      - "scripts/github/switch-backend-production-traffic.sh"
      - "scripts/github/verify-backend-production-health.sh"
      - "scripts/github/verify-backend-correlated-logs.sh"
      - "scripts/github/verify-mcp-release.sh"
      - "scripts/github/resolve-mcp-release-mode.sh"
      - "scripts/github/verify-smart-create-queue.sh"
      - "scripts/backend_release/**"
  workflow_dispatch:
    inputs:
      verification_run_id:
        description: "Verification only: completed run ID with successful migration, traffic switch, and cleanup (pair with its run attempt; leave both empty to deploy)"
        type: string
        required: false
        default: ""
      verification_run_attempt:
        description: "Verification only: exact run attempt for verification_run_id (pair with its run ID; leave both empty to deploy)"
        type: string
        required: false
        default: ""

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  PROJECT_ID: sarj-docs
  REGION: ${{ vars.BACKEND_REGION || 'me-central2' }}
  REPOSITORY: ${{ vars.BACKEND_REPOSITORY || 'sarj-docs-dammam' }}
  SERVICE: ${{ vars.BACKEND_SERVICE || 'sarj-docs-backend-dammam' }}
  MIGRATION_JOB: ${{ vars.BACKEND_MIGRATION_JOB || 'sarj-docs-backend-migrations-dammam' }}
  IMAGE: backend
  SMART_CREATE_QUEUE_NAME: ${{ vars.SMART_CREATE_QUEUE_NAME || 'smart-create-dammam' }}
  DOCUMENT_TRANSFORM_QUEUE_NAME: ${{ vars.DOCUMENT_TRANSFORM_QUEUE_NAME || 'document-transform-dammam' }}

jobs:
  ci-backend:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_run_id == '' && inputs.verification_run_attempt == ''))
    permissions:
      contents: read
    uses: ./.github/workflows/ci-backend.yml

  ci-frontend:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_run_id == '' && inputs.verification_run_attempt == ''))
    permissions:
      contents: read
    uses: ./.github/workflows/ci-frontend.yml

  ci-quality:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_run_id == '' && inputs.verification_run_attempt == ''))
    permissions:
      contents: read
    uses: ./.github/workflows/ci-quality.yml

  ci-iac:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_run_id == '' && inputs.verification_run_attempt == ''))
    permissions:
      contents: read
    uses: ./.github/workflows/ci-iac.yml

  standards-receipt:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_run_id == '' && inputs.verification_run_attempt == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      release_sha: ${{ steps.receipt.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/uv.toml
          enable-cache: false

      - name: Verify exact main Standards receipt
        id: receipt
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/github/verify-release-gate.sh standards backend

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verification_run_id == '' && inputs.verification_run_attempt == ''))
    needs: [ci-backend, ci-frontend, ci-quality, ci-iac, standards-receipt]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/uv.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Restore prerequisite pre-commit environments
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Recheck immutable main release before credentials
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/github/verify-release-gate.sh ready backend

      - name: Set up Python
        working-directory: backend
        run: uv python install

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev --locked

      - name: Run pre-commit custom standards
        run: uvx --python 3.14 pre-commit run --all-files --show-diff-on-failure

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Identify Mypy cache toolchain
        id: mypy-toolchain
        working-directory: backend
        run: |
          uv run python -c 'import importlib.metadata, platform; print("python=" + platform.python_version()); print("mypy=" + importlib.metadata.version("mypy"))' >> "$GITHUB_OUTPUT"

      - name: Restore prerequisite Mypy incremental data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.mypy_cache
          key: mypy-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.mypy-toolchain.outputs.python }}-mypy${{ steps.mypy-toolchain.outputs.mypy }}-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'backend/.python-version', 'backend/uv.toml', 'backend/mypy.ini', 'backend/.mypy.ini', 'backend/setup.cfg', '.sarj-standards.toml', '.github/workflows/ci-backend.yml') }}-${{ github.sha }}
          restore-keys: |
            mypy-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.mypy-toolchain.outputs.python }}-mypy${{ steps.mypy-toolchain.outputs.mypy }}-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'backend/.python-version', 'backend/uv.toml', 'backend/mypy.ini', 'backend/.mypy.ini', 'backend/setup.cfg', '.sarj-standards.toml', '.github/workflows/ci-backend.yml') }}-

      - name: Mypy strict
        working-directory: backend
        run: uv run mypy app

      - name: Basedpyright strict
        working-directory: backend
        run: uv run basedpyright -p pyrightconfig.json

      - name: ty check
        working-directory: backend
        run: uv run ty check app

      - name: Vulture dead-code check
        working-directory: backend
        run: uv run vulture

      - name: Import contracts
        working-directory: backend
        run: uv run lint-imports

      - name: pip-audit
        working-directory: backend
        run: uv run pip-audit

      - name: Unit tests
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Confirm main has not advanced before cloud authentication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/github/verify-release-gate.sh ready backend

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Verify task queues are running
        run: scripts/github/verify-smart-create-queue.sh

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: RELEASE_SHA=${{ github.sha }}
          context: backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Artifact Registry has immutable_tags enabled (terraform/registry.tf).
          # buildx provenance/SBOM attestations push the image under the tag and
          # then *update* the tag to a manifest index — which immutable tags
          # reject ("cannot update tag"), failing every deploy. Push a single
          # image manifest instead so the tag is only ever created, not updated.
          provenance: false
          sbom: false

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Deploy candidate without traffic
        id: deploy
        run: scripts/github/deploy-backend-candidate.sh

      - name: Run database migrations once
        id: migrate
        env:
          RELEASE_IMAGE: ${{ steps.deploy.outputs.release_image }}
        run: scripts/github/run-backend-migrations.sh

      - name: Switch production traffic
        id: traffic
        env:
          CANDIDATE_REVISION: ${{ steps.deploy.outputs.new_revision }}
        run: scripts/github/switch-backend-production-traffic.sh

      - name: Verify revision and production health
        id: verify
        run: scripts/github/verify-backend-production-health.sh

      - name: Resolve native MCP mode from exact revision
        id: mcp-mode
        env:
          MCP_VERIFIED_REVISION: ${{ steps.verify.outputs.new_revision }}
        run: scripts/github/resolve-mcp-release-mode.sh

      - name: Verify native MCP production contract
        env:
          MCP_VERIFY_MODE: ${{ steps.mcp-mode.outputs.mode }}
          MCP_VERIFIED_REVISION: ${{ steps.verify.outputs.new_revision }}
          MCP_LOG_WINDOW_START: ${{ steps.deploy.outputs.started_at }}
        run: scripts/github/verify-mcp-release.sh

      - name: Clear legacy global drive-tree cache after traffic switch
        env:
          RELEASE_IMAGE: ${{ steps.deploy.outputs.release_image }}
        run: scripts/github/clear-legacy-drive-tree-cache.sh

      - name: Verify correlated production logs
        env:
          CANARY_ID: ${{ steps.verify.outputs.canary_id }}
          DEPLOY_STARTED_AT: ${{ steps.deploy.outputs.started_at }}
          VERIFIED_REVISION: ${{ steps.verify.outputs.new_revision }}
          VERIFY_FINISHED_AT: ${{ steps.verify.outputs.finished_at }}
        run: scripts/github/verify-backend-correlated-logs.sh

      - name: Report blocked release without rollback
        if: failure()
        env:
          CANDIDATE_REVISION: ${{ steps.deploy.outputs.new_revision || 'unknown' }}
          MIGRATION_OUTCOME: ${{ steps.migrate.outcome || 'not-run' }}
          PREVIOUS_REVISION: ${{ steps.deploy.outputs.previous_revision || 'unknown' }}
          TRAFFIC_OUTCOME: ${{ steps.traffic.outcome || 'not-run' }}
        run: scripts/github/report-blocked-backend-release.sh

  verify-existing:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.verification_run_id != '' && inputs.verification_run_attempt != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/uv.toml
          enable-cache: false
      - name: Verify completed source mutation receipts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.verification_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          uv run --no-project --python 3.14 python -m scripts.backend_release.recovery \
            --sha "$GITHUB_SHA" source --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Verify exact serving image before canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/backend_release/verify-serving.sh
      - name: Verify task queues are running
        run: scripts/github/verify-smart-create-queue.sh
      - name: Begin fresh verification window
        id: window
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%S.%NZ')" >> "$GITHUB_OUTPUT"
      - name: Verify revision and production health
        id: verify
        run: scripts/github/verify-backend-production-health.sh
      - name: Resolve native MCP mode from exact revision
        id: mcp-mode
        env:
          MCP_VERIFIED_REVISION: ${{ steps.verify.outputs.new_revision }}
        run: scripts/github/resolve-mcp-release-mode.sh

      - name: Verify native MCP production contract
        env:
          MCP_VERIFY_MODE: ${{ steps.mcp-mode.outputs.mode }}
          MCP_VERIFIED_REVISION: ${{ steps.verify.outputs.new_revision }}
          MCP_LOG_WINDOW_START: ${{ steps.window.outputs.started_at }}
        run: scripts/github/verify-mcp-release.sh
      - name: Verify correlated production logs
        env:
          CANARY_ID: ${{ steps.verify.outputs.canary_id }}
          DEPLOY_STARTED_AT: ${{ steps.window.outputs.started_at }}
          VERIFIED_REVISION: ${{ steps.verify.outputs.new_revision }}
          VERIFY_FINISHED_AT: ${{ steps.verify.outputs.finished_at }}
        run: scripts/github/verify-backend-correlated-logs.sh
      - name: Recheck exact serving image after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/backend_release/verify-serving.sh

  reject-partial-verification-inputs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && ((inputs.verification_run_id == '' && inputs.verification_run_attempt != '') || (inputs.verification_run_id != '' && inputs.verification_run_attempt == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require a complete verification source identity
        run: exit 1
