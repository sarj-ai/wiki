name: CI IaC

"on":
  workflow_call:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-iac.yml"
      - "scripts/check-terraform.sh"
      - "Makefile"
      - ".mise.toml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-iac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validation:
    name: IaC / Terraform validation
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      TF_PLUGIN_CACHE_DIR: /tmp/terraform-provider-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Prepare Terraform provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Restore Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate real provider schemas and offline preview wiring
        run: make check-iac

  trivy-config:
    name: IaC / Trivy config scan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy config scan (gate HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          output: trivy-report.txt

      - name: Publish report to job summary
        id: trivy_summary_header
        if: always()
        run: printf '%s\n' '## Trivy IaC scan (terraform/)' "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Append IaC scan report
        id: trivy_summary_report
        if: always() && steps.trivy_summary_header.outcome == 'success'
        run: cat trivy-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Close IaC scan summary
        if: always() && steps.trivy_summary_header.outcome == 'success' && steps.trivy_summary_report.outcome == 'success'
        run: printf '%s\n' "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
  required:
    name: IaC / required
    if: ${{ always() }}
    needs: [trivy-config, terraform-validation]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 1
    steps:
      - name: Require the IaC gate
        env:
          TRIVY_RESULT: ${{ needs.trivy-config.result }}
          TERRAFORM_RESULT: ${{ needs.terraform-validation.result }}
        run: test "$TRIVY_RESULT" = success
      - name: Require Terraform validation
        env:
          TERRAFORM_RESULT: ${{ needs.terraform-validation.result }}
        run: test "$TERRAFORM_RESULT" = success
