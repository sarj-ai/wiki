name: CI IaC

"on":
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-iac.yml"
      - "scripts/check-terraform.sh"
      - "Makefile"
      - ".mise.toml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validation:
    name: IaC / Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate real provider schemas and offline preview wiring
        run: make check-iac

  trivy-config:
    name: IaC / Trivy config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy config scan (gate HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          output: trivy-report.txt

      - name: Publish report to job summary
        if: always()
        run: |
          {
            echo '## Trivy IaC scan (terraform/)'
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  required:
    name: IaC / required
    if: ${{ always() }}
    needs: [trivy-config, terraform-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the IaC gate
        env:
          TRIVY_RESULT: ${{ needs.trivy-config.result }}
          TERRAFORM_RESULT: ${{ needs.terraform-validation.result }}
        run: test "$TRIVY_RESULT" = success && test "$TERRAFORM_RESULT" = success
