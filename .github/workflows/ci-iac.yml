name: CI IaC

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-iac.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/ci-iac.yml"

concurrency:
  group: ci-iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-config:
    name: Trivy IaC scan (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Report-only first pass: surfaces misconfigurations in the Terraform that
      # provisions Secret Manager / IAM / Cloud Armor without gating. Promote to
      # blocking (exit-code: 1) after the baseline is triaged with a .trivyignore.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
