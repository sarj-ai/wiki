name: CI IaC

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-iac.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/ci-iac.yml"

permissions:
  contents: read

concurrency:
  group: ci-iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-config:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Trivy config scan (gate HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          output: trivy-report.txt

      - name: Publish report to job summary
        if: always()
        run: |
          {
            echo '## Trivy IaC scan (terraform/)'
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
