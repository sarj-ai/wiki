name: CI IaC

"on":
  push:
    branches: [main, "feat/**"]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-iac.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-config:
    name: IaC / Trivy config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy config scan (gate HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          output: trivy-report.txt

      - name: Publish report to job summary
        if: always()
        run: |
          {
            echo '## Trivy IaC scan (terraform/)'
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  required:
    name: IaC / required
    if: ${{ always() }}
    needs: [trivy-config]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the IaC gate
        env:
          TRIVY_RESULT: ${{ needs.trivy-config.result }}
        run: test "$TRIVY_RESULT" = success
