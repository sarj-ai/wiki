name: Deploy Frontend

"on":
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
      - "scripts/github/release_gate.py"
      - "scripts/github/verify-release-gate.sh"
      - "scripts/frontend_release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  ci-backend:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: ./.github/workflows/ci-backend.yml

  ci-frontend:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: ./.github/workflows/ci-frontend.yml

  ci-quality:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: ./.github/workflows/ci-quality.yml

  ci-iac:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: ./.github/workflows/ci-iac.yml

  standards-receipt:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      release_sha: ${{ steps.receipt.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/uv.toml
          enable-cache: false

      - name: Verify exact main Standards receipt
        id: receipt
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/github/verify-release-gate.sh standards frontend

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [ci-backend, ci-frontend, ci-quality, ci-iac, standards-receipt]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/uv.toml

      - name: Recheck immutable main release before credentials
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/github/verify-release-gate.sh ready frontend

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install analysis and frontend dependencies
        working-directory: .
        run: |
          uv sync --locked --project backend
          npm ci --prefix frontend

      - name: Bootstrap analysis inputs
        working-directory: .
        run: npm --prefix frontend run generate:api

      - name: Run pre-commit custom standards
        working-directory: .
        run: uvx --python 3.14 pre-commit run --all-files --show-diff-on-failure

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Knip
        run: npm run knip

      - name: Type coverage
        run: npm run type-coverage

      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run vitest
        run: npm test

      - name: Build for Cloudflare Workers
        run: npm run build:worker
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}

      - name: Confirm main has not advanced before cloud authentication
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/github/verify-release-gate.sh ready frontend

      - name: Capture current production version
        id: previous
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          previous_version="$(uv run --no-project --python 3.14 \
            python -m scripts.frontend_release.rollback active)"
          echo "version_id=$previous_version" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        id: deploy
        run: |
          test ! -e "$WRANGLER_OUTPUT_FILE_PATH"
          npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/frontend-deploy-${{ github.run_id }}-${{ github.run_attempt }}.jsonl

      - name: Verify exact production revision
        id: verify
        working-directory: .
        run: |
          body_file="$RUNNER_TEMP/frontend-health-body.json"
          headers_file="$RUNNER_TEMP/frontend-health-headers.txt"
          canary_id="$(node --eval 'process.stdout.write(crypto.randomUUID())')"

          for attempt in 1 2 3 4 5 6; do
            if ! status="$(curl --silent --show-error --max-time 15 \
                --output "$body_file" \
                --dump-header "$headers_file" \
                --write-out '%{http_code}' \
                --header "X-Request-ID: $canary_id" \
                https://wiki.sarj.ai/health)"; then
              status=000
            fi
            response_id="$(awk -F ':' '
              tolower($1) == "x-request-id" {
                sub(/^[^:]*:[[:space:]]*/, "")
                gsub(/\r/, "")
                value = $0
              }
              END { print value }
            ' "$headers_file")"
            cache_control="$(awk -F ':' '
              tolower($1) == "cache-control" {
                sub(/^[^:]*:[[:space:]]*/, "")
                gsub(/\r/, "")
                value = tolower($0)
              }
              END { print value }
            ' "$headers_file")"
            cache_ok=false
            case ",${cache_control// /}," in
              *,no-store,*) cache_ok=true ;;
            esac
            body_ok=false
            if jq --exit-status --arg sha "$GITHUB_SHA" \
              '.status == "ok" and .revision == $sha' "$body_file" >/dev/null; then
              body_ok=true
            fi
            request_id_ok=false
            if test "$response_id" = "$canary_id"; then
              request_id_ok=true
            fi
            if test "$status" = 200 \
              && test "$body_ok" = true \
              && test "$request_id_ok" = true \
              && test "$cache_ok" = true; then
              rm -f "$body_file" "$headers_file"
              echo "Frontend production revision verified."
              exit 0
            fi
            echo "Frontend revision not ready (attempt $attempt/6, HTTP ${status:-000}, body=$body_ok, request_id=$request_id_ok, no_store=$cache_ok)."
            sleep 10
          done

          rm -f "$body_file" "$headers_file"
          echo "Frontend production revision could not be verified." >&2
          exit 1

      - name: Roll back an unverified frontend release
        if: ${{ always() && steps.previous.outcome == 'success' && steps.verify.outcome != 'success' }}
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version_id }}
          CANDIDATE_RECEIPT: ${{ runner.temp }}/frontend-deploy-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
        run: |
          uv run --no-project --python 3.14 python -m scripts.frontend_release.rollback \
            rollback --previous "$PREVIOUS_VERSION" --receipt "$CANDIDATE_RECEIPT"
