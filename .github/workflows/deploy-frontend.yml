name: Deploy Frontend

"on":
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
      - ".github/workflows/deploy-frontend.yml"
      - "scripts/github/release_gate.py"
      - "scripts/github/verify-release-gate.sh"
      - "scripts/frontend_release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  ci-backend:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: ./.github/workflows/ci-backend.yml

  ci-frontend:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: ./.github/workflows/ci-frontend.yml

  ci-quality:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: ./.github/workflows/ci-quality.yml

  ci-iac:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: ./.github/workflows/ci-iac.yml

  standards-receipt:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      release_sha: ${{ steps.receipt.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/uv.toml
          enable-cache: false

      - name: Verify exact main Standards receipt
        id: receipt
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/github/verify-release-gate.sh standards frontend

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [ci-backend, ci-frontend, ci-quality, ci-iac, standards-receipt]
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: backend/uv.toml

      - name: Recheck immutable main release before credentials
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/github/verify-release-gate.sh ready frontend

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: .
        run: npm ci --prefix frontend

      - name: Build for Cloudflare Workers
        run: npm run build:worker
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}

      - name: Confirm main has not advanced before cloud authentication
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/github/verify-release-gate.sh ready frontend

      - name: Capture current production version
        id: previous
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run --no-project --with typer==0.27.2 --python 3.14 python -m scripts.frontend_release.rollback active --github-output >> "$GITHUB_OUTPUT"
      - name: Require an unused deployment receipt path
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/frontend-deploy-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
        run: test ! -e "$WRANGLER_OUTPUT_FILE_PATH"
      - name: Deploy to Cloudflare
        id: deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/frontend-deploy-${{ github.run_id }}-${{ github.run_attempt }}.jsonl

      - name: Verify exact production revision
        id: verify
        working-directory: .
        run: bash scripts/frontend_release/verify-health.sh

      - name: Roll back an unverified frontend release
        if: ${{ always() && steps.previous.outcome == 'success' && steps.verify.outcome != 'success' }}
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version_id }}
          CANDIDATE_RECEIPT: ${{ runner.temp }}/frontend-deploy-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
        run: |
          uv run --no-project --with typer==0.27.2 --python 3.14 python -m scripts.frontend_release.rollback \
            rollback --previous "$PREVIOUS_VERSION" --receipt "$CANDIDATE_RECEIPT"
