name: Deploy Frontend

"on":
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install analysis and frontend dependencies
        working-directory: .
        run: |
          uv sync --locked --project backend
          npm ci --prefix frontend

      - name: Bootstrap analysis inputs
        working-directory: .
        run: npm --prefix frontend run generate:api

      - name: Run pre-commit custom standards
        working-directory: .
        run: uvx --python 3.14 pre-commit run --all-files --show-diff-on-failure

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Knip
        run: npm run knip

      - name: Type coverage
        run: npm run type-coverage

      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run vitest
        run: npm test

      - name: Build for Cloudflare Workers
        run: npm run build:worker
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
