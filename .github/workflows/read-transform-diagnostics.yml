name: Read Transform Diagnostics

"on":
  workflow_dispatch:
    inputs:
      task_id:
        description: Exact document-transform task UUID
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnostics:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      QA_TASK_ID: ${{ inputs.task_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
      - name: Validate exact task UUID before authentication
        run: uv run --script scripts/github/read-transform-diagnostics.py --validate-only
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Read only bounded allowlisted diagnostics
        run: uv run --script scripts/github/read-transform-diagnostics.py
