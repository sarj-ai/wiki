version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    # The Standards toolchain is exact-pinned against .sarj-standards.toml and
    # only moves as one change via `make standards-upgrade`; a lone Dependabot
    # bump would desync the pin sites and fail `sarj-lint-configs doctor`.
    ignore:
      - dependency-name: sarj-lint-configs
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    # The eslint.peers.json member set is exact-pinned as one proven-resolvable
    # unit; it moves only via `make standards-upgrade` when the Standards pin
    # bumps. Dependabot bumping any member alone would break that contract.
    ignore:
      - dependency-name: "@eslint-community/eslint-plugin-eslint-comments"
      - dependency-name: "@eslint/compat"
      - dependency-name: "@sarj/eslint-plugin"
      - dependency-name: "@sarj/tsconfig"
      - dependency-name: eslint
      - dependency-name: eslint-plugin-better-tailwindcss
      - dependency-name: eslint-plugin-perfectionist
      - dependency-name: eslint-plugin-react
      - dependency-name: eslint-plugin-react-hooks
      - dependency-name: eslint-plugin-simple-import-sort
      - dependency-name: eslint-plugin-unicorn
      - dependency-name: eslint-plugin-zod
      - dependency-name: typescript
      - dependency-name: typescript-eslint
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      radix:
        patterns: ["@radix-ui/*", "radix-ui"]
      testing:
        patterns: ["@testing-library/*", "vitest", "@vitest/*", "happy-dom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
