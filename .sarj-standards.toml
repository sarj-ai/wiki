# Managed by `code-standards setup`; commit this file.
schema = 3
bundle = "7.5.4"
rule_profile = "all"

[capabilities]
disable = ["markdownlint", "taplo"]



[artifacts]
durable = ["**/README.md", "docs/**", "**/docs/**", "architecture/**", "**/adr/**", ".github/**", "**/AGENTS.md", "**/CLAUDE.md"]

[text]
exclude = ["**/.env.example"]

[dest]
python = "backend"
typescript = "frontend"

[hooks]
manager = "lefthook"

[baseline]
diagnostics = "diagnostic-baseline.json"

[ci]
bootstrap = ["npm --prefix frontend run generate:api", "npm --prefix frontend run typegen"]
