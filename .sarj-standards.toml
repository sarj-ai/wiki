# Managed by `code-standards setup`; commit this file.
schema = 4
bundle = "7.32.4"
profile = "standard"
rule_profile = "all"

[capabilities]
disable = ["swiftformat", "swiftlint", "ktlint", "detekt", "mobile-security", "markdownlint", "taplo"]

[artifacts]
durable = ["**/README.md", "docs/**", "**/docs/**", "architecture/**", "**/adr/**", ".github/**", "**/AGENTS.md", "**/CLAUDE.md"]

[dest]
python = "backend"
typescript = "frontend"
swift = "."
kotlin = "."

[hooks]
manager = "lefthook"

[text]
exclude = ["**/.env.example"]

[baseline]
diagnostics = "diagnostic-baseline.json"

[ci]
bootstrap = ["npm --prefix frontend run generate:api", "npm --prefix frontend run typegen"]
