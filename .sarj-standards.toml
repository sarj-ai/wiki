# Managed by `code-standards setup`; commit this file.
bundle = "8.36.2"
rule_profile = "all"
schema = 4

[capabilities]
disable = [
  "swiftformat",
  "swiftlint",
  "ktlint",
  "detekt",
  "mobile-security",
  "markdownlint",
  "taplo",
  "zizmor",
  "checkov",
]

[artifacts]
durable = [
  "**/README.md",
  "docs/**",
  "**/docs/**",
  "architecture/**",
  "**/adr/**",
  ".github/**",
  "**/AGENTS.md",
  "**/CLAUDE.md",
]

[dest]
kotlin = "."
python = "backend"
swift = "."
typescript = "frontend"

[hooks]
manager = "lefthook"

[text]
exclude = ["**/.env.example"]

[baseline]
diagnostics = "diagnostic-baseline.json"

[ci]
bootstrap = [
  "npm --prefix frontend run generate:api",
  "npm --prefix frontend run typegen",
]
runner = "blacksmith-2vcpu-ubuntu-2404"
