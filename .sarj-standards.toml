# Generated by `sarj-standards init`; commit this file.
schema = 3
bundle = "5.10.0"
rule_profile = "all"

[capabilities]
disable = ["markdownlint", "taplo"]



[artifacts]
durable = ["**/README.md", "docs/**", "**/docs/**", "architecture/**", "**/adr/**", ".github/**", "**/AGENTS.md", "**/CLAUDE.md"]

[text]
exclude = ["**/.env.example"]

[dest]
python = "backend"
typescript = "frontend"

[hooks]
manager = "lefthook"

[baseline]
diagnostics = "diagnostic-baseline.json"

[ci]
bootstrap = ["npm --prefix frontend run generate:api"]
