# Written by `sarj-lint-configs init`. Commit this file.
#
# This is the ONE version for the whole toolchain. Your pyproject pin, your
# pre-commit `rev:` and your CI job must all agree with it; run
# `sarj-lint-configs doctor` to prove they do. The sibling linter versions are
# not listed because they are not yours to choose -- sarj-lint-configs pins them
# exactly, and `doctor` reads them out of the installed wheel.
version = "0.37.1"

# Only the configs this repo actually uses. `sync` and `sync --check` operate on
# exactly this list, so a Python repo is not asked to carry an ESLint config.
configs = ["ruff", "pyright", "eslint", "markdownlint", "taplo", "yamllint"]

[dest]
python = "backend"
typescript = "frontend"
