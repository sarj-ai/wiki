repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/public/
      - id: end-of-file-fixer
        exclude: ^frontend/public/
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: sarj-strict-markdownlint
        name: "sarj-config: strict Markdown"
        entry: markdownlint-cli2 --config .markdownlint.yaml
        language: node
        additional_dependencies: [markdownlint-cli2@0.23.2]
        types: [markdown]
      - id: sarj-strict-taplo
        name: "sarj-config: strict TOML"
        entry: taplo lint --config .taplo.toml
        language: node
        additional_dependencies: ["@taplo/cli@0.7.0"]
        types: [toml]
      - id: sarj-strict-yamllint
        name: "sarj-config: strict YAML"
        entry: yamllint --strict --config-file .yamllint.yaml
        language: python
        additional_dependencies: [yamllint==1.38.0]
        types: [yaml]

  - repo: https://github.com/sarj-ai/standards
    # Immutable snapshot of standards main after #139. This intentionally
    # includes rules newer than the latest language-specific release tags.
    rev: 9d073e83b24cd5af788a61996cd9238d85d927d4
    hooks:
      - id: sarj-no-sequential-await
      - id: sarj-inefficient-string-concat-in-loop
      - id: sarj-prefer-str-enum
      - id: sarj-no-fat-try-blocks
      - id: sarj-pydantic-at-boundaries
      - id: sarj-no-isinstance-union-chain
      - id: sarj-prefer-class-row
      - id: sarj-prefer-timedelta-for-durations
      - id: sarj-prefer-struct-over-namedtuple
      - id: sarj-no-comment-cruft
      - id: sarj-no-restated-comment
      - id: sarj-redundant-docstring
      - id: sarj-trailing-value-narration
      - id: sarj-no-fstring-in-log
      - id: sarj-prefer-match-assert-never
      - id: sarj-kwonly-same-type-params
      - id: sarj-no-raw-sql-in-tests
      - id: sarj-no-file-level-suppression
      - id: sarj-prefer-module-level-constant
      - id: sarj-prefer-non-nullable-collection
      - id: sarj-enforce-timestamptz
      - id: sarj-ban-postgres-enums
      - id: sarj-ban-create-trigger
      - id: sarj-prefer-text-over-varchar
      - id: sarj-idempotent-ddl
      - id: sarj-insert-requires-on-conflict
      - id: sarj-prefer-jsonb
      - id: sarj-no-limit-offset
      - id: sarj-index-concurrently
      - id: sarj-require-deletion-protection
      - id: sarj-no-comment-cruft-iac
      - id: sarj-mock-without-spec
      - id: sarj-test-loops-over-literal-cases
      - id: sarj-parametrize-case-needs-id
      - id: sarj-zero-assertion-test
      - id: sarj-fixture-returns-bare-tuple
      - id: sarj-kwarg-heavy-construction-in-test
      - id: sarj-xfail-requires-strict
      - id: sarj-sleep-with-computed-arg-in-test
      - id: sarj-no-first-party-private-import
      - id: sarj-no-stdlib-logging
      - id: sarj-no-gen-random-uuid-in-sql
      - id: sarj-no-file-level-escape-hatch-noqa
      - id: sarj-no-optional-tenant-predicate
      - id: sarj-no-tautological-expect
      - id: sarj-prefer-uuidv7-default
      - id: sarj-suppression-ratchet
      - id: sarj-fakes-in-shared-location
      - id: sarj-no-raw-connection-in-tests
      - id: sarj-no-sentinel-return-on-except
      - id: sarj-no-unreachable-after-terminal
      - id: sarj-prefer-constant-time-secret-compare
      - id: sarj-no-secret-in-log
      - id: sarj-store-insert-requires-on-conflict
      - id: sarj-no-query-with-many-joins
      - id: sarj-no-aggregation-in-store-query
      - id: sarj-no-select-star
      - id: sarj-single-public-export
      - id: sarj-primary-export-file-name
        exclude: ^backend/app/(?:request_id|logging_config|[^/]+/(?:router|schemas|dependencies|breadcrumb))\.py$
      - id: sarj-stepdown
      - id: sarj-no-repeated-string-literal
      - id: sarj-no-offset-pagination
      - id: sarj-prefer-namedtuple-over-tuple-return
      - id: sarj-no-cors-wildcard-with-credentials
      - id: sarj-no-sleep-in-test-body
      - id: sarj-prefer-real-store-in-tests
      - id: sarj-prefer-library-fake
      - id: sarj-tautological-mock-assertion
      - id: sarj-no-patching-system-under-test
      - id: sarj-over-mocked-test
      - id: sarj-interaction-only-test
      - id: sarj-trivially-true-assertion
      - id: sarj-conditional-assertion-in-test
      - id: sarj-duplicate-test-body
      - id: sarj-unused-mock-setup
      - id: sarj-prefer-fstring-over-concat
      - id: sarj-prefer-match-pattern-destructuring
      - id: sarj-prefer-or-pattern
      - id: sarj-require-port-for-service
      - id: sarj-prefer-match-type-dispatch
      - id: sarj-prefer-walrus-regex-match
      - id: sarj-prefer-walrus-comprehension-filter
      - id: sarj-prefer-walrus-stream-loop
      - id: sarj-prefer-self-type-annotation
      - id: sarj-prefer-pattern-matching
      - id: sarj-require-lock-timeout
      - id: sarj-add-constraint-not-valid
      - id: sarj-require-fk-index
