repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/public/
      - id: end-of-file-fixer
        exclude: ^frontend/public/
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: sarj-strict-markdownlint
        name: "sarj-config: strict Markdown"
        entry: markdownlint-cli2 --config .markdownlint.yaml
        language: node
        additional_dependencies: [markdownlint-cli2@0.23.2]
        types: [markdown]
      - id: sarj-strict-taplo
        name: "sarj-config: strict TOML"
        entry: taplo lint --config .taplo.toml
        language: node
        additional_dependencies: ["@taplo/cli@0.7.0"]
        types: [toml]
      - id: sarj-strict-yamllint
        name: "sarj-config: strict YAML"
        entry: yamllint --strict --config-file .yamllint.yaml
        language: python
        additional_dependencies: [yamllint==1.38.0]
        types: [yaml]
      - id: sarj-current-registries
        name: "sarj-config: every current Python, SQL, and IaC rule"
        entry: uv run --project backend --locked python scripts/check_standards.py
        language: system
        types_or: [python, sql, terraform, yaml]
