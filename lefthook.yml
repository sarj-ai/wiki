min_version: 2.1.10
assert_lefthook_installed: true

pre-commit:
  parallel: false
  commands:
    standards-config:
      run: make standards-check
      fail_text: "Canonical Standards configs drifted. Run 'make standards-sync', stage the result, and retry."
    backend-ruff:
      root: backend/
      glob: "*.py"
      run: uv run ruff check {staged_files}
      fail_text: "Ruff rejected staged Python. Run its suggested fix, stage, and retry."
    backend-ruff-format:
      root: backend/
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
      fail_text: "AGENT: staged Python is not ruff-formatted. Fix: run 'uv run ruff format <files>' in backend/, stage the result, and retry. NEVER use --no-verify."
    frontend-eslint:
      root: frontend/
      glob: "*.{js,mjs,cjs,ts,tsx}"
      run: >-
        npm exec -- next typegen &&
        npm exec -- eslint --no-warn-ignored --max-warnings 0 --suppressions-location eslint-suppressions.json {staged_files} &&
        npm exec -- tsc --noEmit --pretty false
      fail_text: "ESLint or TypeScript rejected staged frontend code. Fix the reported issue, stage, and retry."
    frontend-prettier:
      root: frontend/
      glob: "*.{js,mjs,cjs,ts,tsx,json,css,md,yml,yaml}"
      run: npm exec -- prettier --check --ignore-unknown {staged_files}
      fail_text: "AGENT: staged frontend files are not Prettier-formatted. Fix: run 'npm run format' in frontend/ (or prettier --write on the listed files), stage, and retry. NEVER use --no-verify."
    markdownlint:
      glob: "*.md"
      run: frontend/node_modules/.bin/markdownlint-cli2 --config .markdownlint.yaml {staged_files}
      fail_text: "AGENT: markdownlint rejected staged Markdown against the canonical .markdownlint.yaml. Fix: repair the reported lines (markdownlint-cli2 --fix handles most), stage, and retry. NEVER use --no-verify."
    taplo:
      glob: "*.toml"
      run: frontend/node_modules/.bin/taplo lint --config .taplo.toml {staged_files}
      fail_text: "AGENT: taplo rejected staged TOML against the canonical .taplo.toml. Fix: repair the reported keys, stage, and retry. NEVER use --no-verify."
    yamllint:
      glob: "*.{yml,yaml}"
      run: UV_CACHE_DIR=/tmp/sarj-docs-uv-cache uvx --python 3.14 yamllint --strict --config-file .yamllint.yaml {staged_files}
      fail_text: "AGENT: yamllint rejected staged YAML against the canonical .yamllint.yaml. Fix: repair the reported lines, stage, and retry. NEVER use --no-verify."
    standards:
      run: UV_CACHE_DIR=/tmp/sarj-docs-uv-cache uvx --python 3.14 pre-commit run
      fail_text: "AGENT: a pre-commit hook (hygiene, gitleaks, actionlint, or a sarj-* rule) rejected staged files. Fix: repair the reported finding (sarj rules accept a narrow '# sarj-noqa: SARJ0XX — reason' only with justification), stage, and retry. NEVER use --no-verify."

pre-push:
  commands:
    check:
      run: make check
      fail_text: "AGENT: 'make check' (the exact CI mirror) failed. Fix: rerun 'make check', repair the first failing step ('make fix' applies the autofixable lint/format part), and push again. NEVER use --no-verify."
