min_version: 2.1.10
assert_lefthook_installed: true

pre-commit:
  parallel: false
  commands:
    standards-config:
      run: make standards-check
      fail_text: "Canonical Standards configs drifted. Run 'make standards-sync', stage the result, and retry."
    backend-ruff:
      root: backend/
      glob: "*.py"
      run: uv run ruff check {staged_files}
      fail_text: "Ruff rejected staged Python. Run its suggested fix, stage, and retry."
    backend-ruff-format:
      root: backend/
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    frontend-eslint:
      root: frontend/
      glob: "*.{js,mjs,cjs,ts,tsx}"
      run: >-
        npm exec -- next typegen &&
        npm exec -- eslint --no-warn-ignored {staged_files} &&
        npm exec -- tsc --noEmit --pretty false
      fail_text: "ESLint or TypeScript rejected staged frontend code. Fix the reported issue, stage, and retry."
    frontend-prettier:
      root: frontend/
      glob: "*.{js,mjs,cjs,ts,tsx,json,css,md,yml,yaml}"
      run: npm exec -- prettier --check --ignore-unknown {staged_files}
    markdownlint:
      glob: "*.md"
      run: frontend/node_modules/.bin/markdownlint-cli2 --config .markdownlint.yaml {staged_files}
    taplo:
      glob: "*.toml"
      run: frontend/node_modules/.bin/taplo lint --config .taplo.toml {staged_files}
    yamllint:
      glob: "*.{yml,yaml}"
      run: UV_CACHE_DIR=/tmp/sarj-docs-uv-cache uvx --python 3.14 yamllint --strict --config-file .yamllint.yaml {staged_files}
    standards:
      run: UV_CACHE_DIR=/tmp/sarj-docs-uv-cache uvx --python 3.14 pre-commit run

pre-push:
  parallel: true
  commands:
    standards-all:
      run: UV_CACHE_DIR=/tmp/sarj-docs-uv-cache uvx --python 3.14 pre-commit run --all-files --show-diff-on-failure
    backend-quality:
      run: cd backend && uv run ruff check . && uv run ruff format --check . && uv run mypy app && uv run basedpyright -p pyrightconfig.json && uv run ty check app && uv run vulture && uv run lint-imports && uv run pytest -q
    frontend-quality:
      run: cd frontend && npm run format:check && npm run lint && npm run typecheck && npm run knip && npm run type-coverage && npm test
