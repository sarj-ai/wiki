[project]
name = "sarj-docs-backend"
version = "0.1.0"
description = "Internal knowledge base API for Sarj"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "google-api-python-client>=2.160.0",
    "google-auth>=2.38.0",
    "google-auth-oauthlib>=1.2.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.12.1",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "types-requests>=2.32.0",
    "vulture>=2.16",
    "pyright>=1.1.408",
    "ty>=0.0.31",
    "google-api-python-client-stubs>=1.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "RUF",  # ruff-specific
    "S",    # bandit (security)
    "ARG",  # unused arguments
    "PTH",  # pathlib
    "RET",  # return
    "PIE",  # misc
    "TID",  # tidy imports
    "ASYNC",
    "FA",   # future annotations
]
ignore = [
    "E501",    # line too long — formatter handles wrapping
    "RET504",  # clarity often wins over terseness for assign-then-return
    "S104",    # bind-all-interfaces is intentional for containerized app
    "B008",    # FastAPI uses Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "PLR2004"]
"alembic/env.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
exclude = [
    "^alembic/versions/",
]

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google.auth.*",
    "google.oauth2.*",
    "google_auth_oauthlib.*",
]
ignore_missing_imports = true

[tool.pyright]
include = ["app", "tests"]
exclude = ["alembic/versions", "**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
# The Google Drive API stubs declare every field as NotRequired because Drive
# only echoes back fields named in the `fields=` query param. Our call sites
# always pass a `_FIELDS` string covering id/name/mimeType, so the strict
# NotRequired rule produces noise without catching real bugs.
reportTypedDictNotRequiredAccess = "none"
# google-api-python-client-stubs ships only .pyi stubs for the `_apis.drive`
# modules — pyright warns that the source can't be resolved. That's expected;
# the stubs are the authoritative type definitions.
reportMissingModuleSource = "none"

[tool.ty.src]
include = ["app", "tests"]
exclude = ["alembic/versions"]

[tool.ty.rules]
# ty (astral) is still pre-1.0; start at its default strict posture.

[tool.vulture]
paths = ["app"]
exclude = ["alembic/versions/", "app/__pycache__/"]
min_confidence = 80
ignore_decorators = [
    "@app.*",
    "@router.*",
    "@pytest.fixture",
    "@field_validator",
    "@asynccontextmanager",
]
ignore_names = [
    "lifespan",
    "model_config",
    # field_validator requires the classmethod's first param to be named `cls`;
    # vulture's decorator-aware ignore doesn't reach function parameters, so we
    # whitelist the name instead.
    "cls",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
