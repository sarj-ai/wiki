[project]
name = "sarj-docs-backend"
version = "0.1.0"
description = "Internal knowledge base API for Sarj"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "google-api-python-client>=2.160.0",
    "google-auth>=2.38.0",
    "google-auth-oauthlib>=1.2.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "pyjwt>=2.12.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "types-requests>=2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Modules listed below are scheduled for deletion in Sub-PR C of the Navigator
# pivot (see PIVOT_PLAN.md §12). They are excluded from lint/type-check until
# then so we don't waste effort fixing code we're about to remove.

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "alembic/versions",
    "app/docs_transformer",
    "app/pages",
    "app/workspaces",
    "app/permissions",
    "app/search",
    "app/webhooks",
    "app/internal",
    "app/imports",
    "app/access.py",
    # Drive helpers bound to the old SA flow; replaced in Sub-PR C.
    "app/drive/changes.py",
    "app/drive/content.py",
    "app/drive/files.py",
    "app/drive/folders.py",
    # ORM models bound to tables being dropped in Sub-PR C.
    "app/models/page.py",
    "app/models/workspace.py",
    "app/models/drive_webhook.py",
    "app/models/import_job.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "RUF",  # ruff-specific
    "S",    # bandit (security)
    "ARG",  # unused arguments
    "PTH",  # pathlib
    "RET",  # return
    "PIE",  # misc
    "TID",  # tidy imports
    "ASYNC",
    "FA",   # future annotations
]
ignore = [
    "E501",    # line too long — formatter handles wrapping
    "RET504",  # clarity often wins over terseness for assign-then-return
    "S104",    # bind-all-interfaces is intentional for containerized app
    "B008",    # FastAPI uses Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "PLR2004"]
"alembic/env.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
exclude = [
    "^alembic/versions/",
    "^app/docs_transformer/",
    "^app/pages/",
    "^app/workspaces/",
    "^app/permissions/",
    "^app/search/",
    "^app/webhooks/",
    "^app/internal/",
    "^app/imports/",
    "^app/access\\.py$",
    "^app/drive/changes\\.py$",
    "^app/drive/content\\.py$",
    "^app/drive/files\\.py$",
    "^app/drive/folders\\.py$",
    "^app/models/page\\.py$",
    "^app/models/workspace\\.py$",
    "^app/models/drive_webhook\\.py$",
    "^app/models/import_job\\.py$",
]

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google.auth.*",
    "google.oauth2.*",
    "google_auth_oauthlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
