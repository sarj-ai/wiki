#:schema node_modules/wrangler/config-schema.json

name = "sarj-wiki"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Static assets built by OpenNext
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Bind ``wiki.sarj.ai`` as a Workers Custom Domain. With
# ``custom_domain = true`` Cloudflare provisions the DNS record and
# manages the edge TLS cert automatically — no manual A/CNAME row to
# maintain. Traffic flow: browser → Cloudflare edge (Workers runtime
# executes the OpenNext bundle) → ``api-wiki.sarj.ai`` for backend
# calls via ``NEXT_PUBLIC_API_URL``.
[[routes]]
pattern = "wiki.sarj.ai"
custom_domain = true

# Workers Observability fully on: capture 100% of invocations (head sampling
# rate 1) plus invocation logs, persisted to the Cloudflare dashboard where
# they're queryable. Lets us see real edge request latency / errors / console
# output without a separate logging pipeline.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
